version: "2"

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - gocyclo

  settings:
    gocyclo:
      min-complexity: 18

  exclusions:
    rules:
      # config.Resolve is intentionally complex (one function handles the full
      # config tree). Exclude it from the cyclomatic-complexity check.
      - linters:
          - gocyclo
        path: internal/config/config\.go
      # config_test.go uses t.Context() which requires Go 1.24; the module
      # targets 1.22. The existing test was written before this was detected.
      - linters:
          - govet
        path: internal/config/config_test\.go

formatters:
  enable:
    - gofmt
